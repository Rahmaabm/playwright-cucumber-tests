name: Playwright Tests

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check locale
        run: echo "APP_LOCALE=$APP_LOCALE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.7.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.9

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run Playwright Tests
        run: xvfb-run -a mvn verify

      - name: Archive trace files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: target/traces/*.zip

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin

      - name: Authenticate to Xray
        id: xray-auth
        if: always()
        run: |
          TOKEN=$(curl -s -X POST https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d '{"client_id":"${{ secrets.XRAY_CLIENT_ID }}","client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"}' | tr -d '"')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Import JUnit results into Xray
        if: always()
        run: |
          # Fusion de tous les rapports en un seul fichier
          echo '<?xml version="1.0" encoding="UTF-8"?>' > merged.xml
          echo '<testsuites>' >> merged.xml
          find target/surefire-reports target/failsafe-reports -name 'TEST-*.xml' 2>/dev/null | while IFS= read -r f; do
            echo "Fusion de $f"
            grep -v '^<?xml' "$f" >> merged.xml
          done || true
          echo '</testsuites>' >> merged.xml

          # Import avec affichage de la réponse de Xray
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
            -H "Content-Type: text/xml" \
            --data-binary @merged.xml \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=KAN")

          echo "Code HTTP : $HTTP_CODE"
          echo "Réponse Xray :"
          cat response.txt
          echo ""

          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi